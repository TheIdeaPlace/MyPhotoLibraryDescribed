name: Mac CI

# Builds the Mac app (PhotoFinder/) on a Mac, so Swift written on Windows is compiled before it merges,
# and runs its unit tests. Nothing here signs or ships anything. The Windows app (windows/) has its own CI.
on:
  push:
    branches: [main]
    paths: ['PhotoFinder/**', 'PhotoFinderTests/**', 'project.yml', '.github/workflows/mac-ci.yml']
  pull_request:
    branches: [main]
    paths: ['PhotoFinder/**', 'PhotoFinderTests/**', 'project.yml', '.github/workflows/mac-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The app uses macOS 27 APIs (Apple Intelligence image attachments, Photos' extended metadata),
      # which need the macOS 27 SDK. The newest stable Xcode on the runners (26.x) doesn't have it, so
      # this takes the newest Xcode installed, beta included. Also lists what's installed, for when it fails.
      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # The app's macOS 27 calls (Apple Intelligence images, Photos' extended metadata) sit inside
      # `#if !PF_SDK26`. With an older SDK, that flag leaves them out so everything else still compiles and
      # is tested; once the runners have Xcode 27, nothing is left out.
      - name: Choose build flags
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          if [ "${sdk%%.*}" -lt 27 ]; then
            echo "::warning::macOS 27 code not compiled: the runner's SDK is $sdk. Background describing and Get Info's saved descriptions are only checked by a local Xcode 27 build."
            echo 'SWIFT_FLAGS=OTHER_SWIFT_FLAGS=$(inherited) -DPF_SDK26' >> "$GITHUB_ENV"
          fi

      # Signed ad hoc, which needs no certificate: Apple silicon won't run unsigned code, tests included.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project PhotoFinder.xcodeproj -scheme PhotoFinder -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= ${SWIFT_FLAGS:+"$SWIFT_FLAGS"} test

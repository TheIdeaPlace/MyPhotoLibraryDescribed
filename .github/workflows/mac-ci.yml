name: Mac CI

# Builds the Mac app (PhotoFinder/) on a Mac, so Swift written on Windows is compiled before it merges,
# and runs its unit tests. Nothing here signs or ships anything. The Windows app (windows/) has its own CI.
on:
  push:
    branches: [main]
    paths: ['PhotoFinder/**', 'PhotoFinderTests/**', 'project.yml', '.github/workflows/mac-ci.yml']
  pull_request:
    branches: [main]
    paths: ['PhotoFinder/**', 'PhotoFinderTests/**', 'project.yml', '.github/workflows/mac-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The app uses macOS 27 APIs (Apple Intelligence image attachments, Photos' extended metadata),
      # which need the macOS 27 SDK. The newest stable Xcode on the runners (26.x) doesn't have it, so
      # this takes the newest Xcode installed, beta included. Also lists what's installed, for when it fails.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # No signing on CI: there's no certificate, and none is needed to compile and test.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project PhotoFinder.xcodeproj -scheme PhotoFinder -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build

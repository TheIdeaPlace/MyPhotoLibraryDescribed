name: PhotoFinder
options:
  bundleIdPrefix: net.theideaplace
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoFinder:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - PhotoFinderTests
    sources:
      - PhotoFinder
    # Under the hardened runtime (Release, for notarization) Photos access needs this entitlement, or the library is
    # refused without asking (#22's review).
    entitlements:
      path: PhotoFinder/PhotoFinder.entitlements
      properties:
        com.apple.security.personal-information.photos-library: true
    info:
      path: PhotoFinder/Info.plist
      properties:
        CFBundleName: Photo Finder
        CFBundleDisplayName: Photo Finder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryUsageDescription: Photo Finder lists the photos and videos in your library so you can browse, preview and export them like files.
        # Folders added with File > Add Folder to Library… can be in these places (#36); macOS asks once for each.
        NSDesktopFolderUsageDescription: Photo Finder lists the photos and videos in folders you add to its library.
        NSDocumentsFolderUsageDescription: Photo Finder lists the photos and videos in folders you add to its library.
        NSDownloadsFolderUsageDescription: Photo Finder lists the photos and videos in folders you add to its library.
        NSRemovableVolumesUsageDescription: Photo Finder lists the photos and videos in folders you add to its library.
        NSNetworkVolumesUsageDescription: Photo Finder lists the photos and videos in folders you add to its library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.theideaplace.PhotoFinder
        PRODUCT_NAME: Photo Finder
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: P887QF74N8
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Notarization needs the hardened runtime; releases are built in Release (scripts/release-mac.sh, #22).
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  PhotoFinderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PhotoFinderTests
    dependencies:
      - target: PhotoFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.theideaplace.PhotoFinderTests
        # The app's product name has a space, which XcodeGen's default test host path doesn't account for.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Photo Finder.app/Contents/MacOS/Photo Finder"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P887QF74N8

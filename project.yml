name: PhotoFinder
options:
  bundleIdPrefix: net.theideaplace
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoFinder:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - PhotoFinderTests
    sources:
      - PhotoFinder
      # Help > Check AI Description's sample photo (#95), shared with Windows, which draws it
      # (windows/scripts/MakeSamplePhoto.cs).
      - path: windows/src/PhotoFinder/Assets/SamplePhoto.jpg
        buildPhase: resources
    # Under the hardened runtime (Release, for notarization) Photos access needs this entitlement, or the library is
    # refused without asking (#22's review).
    entitlements:
      path: PhotoFinder/PhotoFinder.entitlements
      properties:
        com.apple.security.personal-information.photos-library: true
    info:
      path: PhotoFinder/Info.plist
      properties:
        CFBundleName: My Photo Library Described
        CFBundleDisplayName: My Photo Library Described
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        # The app kit's relay key (#33), from the build setting below; empty unless the build is given one.
        AppKitRelayKey: $(APPKIT_RELAY_KEY)
        NSPhotoLibraryUsageDescription: My Photo Library Described lists the photos and videos in your library so you can browse, preview and export them like files.
        # Folders added with File > Add Folder to Library… can be in these places (#36); macOS asks once for each.
        NSDesktopFolderUsageDescription: My Photo Library Described lists the photos and videos in folders you add to its library.
        NSDocumentsFolderUsageDescription: My Photo Library Described lists the photos and videos in folders you add to its library.
        NSDownloadsFolderUsageDescription: My Photo Library Described lists the photos and videos in folders you add to its library.
        NSRemovableVolumesUsageDescription: My Photo Library Described lists the photos and videos in folders you add to its library.
        NSNetworkVolumesUsageDescription: My Photo Library Described lists the photos and videos in folders you add to its library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.theideaplace.MyPhotoLibraryDescribed
        # The app icon, the same picture as Windows' (scripts/make-mac-icon.swift draws it).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: My Photo Library Described
        # The module keeps its old name, so `@testable import Photo_Finder` and the code don't churn (#125).
        PRODUCT_MODULE_NAME: Photo_Finder
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: P887QF74N8
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        # Report a Bug's relay key (#33) isn't in the repo: scripts/release-mac.sh passes APPKIT_RELAY_KEY=… to
        # xcodebuild, which overrides this empty default. Without it, Report a Bug opens the GitHub page instead.
        APPKIT_RELAY_KEY: ""
      configs:
        # Notarization needs the hardened runtime; releases are built in Release (scripts/release-mac.sh, #22).
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  PhotoFinderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PhotoFinderTests
    dependencies:
      - target: PhotoFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.theideaplace.MyPhotoLibraryDescribedTests
        # The app's product name has a space, which XcodeGen's default test host path doesn't account for.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/My Photo Library Described.app/Contents/MacOS/My Photo Library Described"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P887QF74N8
